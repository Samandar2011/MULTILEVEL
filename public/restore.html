<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Bazani tiklash</title>
<style>body{font-family:system-ui,sans-serif;max-width:420px;margin:40px auto;padding:0 16px}input,button{width:100%;padding:10px;margin:6px 0;box-sizing:border-box;font-size:16px}#m{margin-top:12px;white-space:pre-wrap}</style></head>
<body><h2>data.json ni yuklash</h2>
<p>Admin hisobi bilan kiring va kompyuteringizdagi <b>data.json</b> faylini tanlang. Joriy baza almashtiriladi.</p>
<input id="e" placeholder="Admin email" autocomplete="username">
<input id="p" type="password" placeholder="Admin parol" autocomplete="current-password">
<input id="f" type="file" accept=".json,application/json">
<button id="b">Yuklash</button><div id="m"></div>
<script>
const m=t=>document.getElementById('m').textContent=t;
document.getElementById('b').onclick=async()=>{
  try{
    const f=document.getElementById('f').files[0];if(!f)return m('Avval data.json faylini tanlang');
    m('Kirilmoqda...');
    const l=await fetch('/api/auth/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:document.getElementById('e').value.trim(),password:document.getElementById('p').value})});
    const lj=await l.json();if(!l.ok)return m(lj.error||'Kirish xatosi');
    m('Yuklanmoqda...');
    const data=JSON.parse(await f.text());
    const r=await fetch('/api/admin/import-db',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+lj.token},body:JSON.stringify({data})});
    const rj=await r.json();
    m(r.ok?('Tayyor! Foydalanuvchilar: '+rj.users+', testlar: '+rj.tests+', savollar: '+rj.questions+'\nEndi bu sahifani GitHub\'dan o\'chiring.'):(rj.error||'Xato'));
  }catch(e){m('Xato: '+e.message)}
};
</script></body></html>
